# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for headless machines. See also
# http://www.gradle.org/configure-gradle-for-source-releases#configure_the_daemon
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/configure-gradle-for-source-releases#configure_parallel_build
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are being used
android.useAndroidX=true

# Kotlin code style for this project: "official" or "idiomatic"
kotlin.code.style=official

# Version settings
compileSdkVersion=34
minSdkVersion=24
targetSdkVersion=34
versionCode=1
versionName=1.0.0

# Gradle settings
org.gradle.jvmargs=-Xmx2048m
org.gradle.workers.max=4
